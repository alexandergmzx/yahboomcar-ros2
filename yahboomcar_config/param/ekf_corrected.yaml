# Corrected EKF configuration. The vendor's ekf.yaml is left untouched alongside this
# one so the course PDFs stay correct and the two can be A/B'd on the same bag.
#
# WHAT IS WRONG WITH THE VENDOR CONFIG
# ------------------------------------
# 1. It fuses BOTH pose and twist from /odom_raw:
#        odom0_config: [true, true, false,     <- x, y
#                       false, false, true,    <- yaw
#                       true, true, false,     <- vx, vy
#                       false, false, true, ...] <- vyaw
#    Pose is the integral of twist. Feeding both puts one measurement in twice, and the
#    filter treats two perfectly correlated inputs as two independent ones. The result is
#    a covariance that shrinks faster than the evidence justifies -- the filter becomes
#    confident, not accurate. (Julier & Uhlmann's covariance-intersection work exists
#    precisely because naive fusion of correlated estimates is inconsistent.)
#
# 2. It fuses BOTH yaw and yaw-rate from the IMU:
#        imu0_config: [..., true (yaw), ..., true (vyaw), ...]
#    Same double-count, and worse here: the ICM-42670-P is a 6-axis IMU with NO
#    magnetometer, so its "yaw" is not an observation of anything absolute. It is the
#    gyro integrated by the driver. Fusing it as an orientation measurement feeds
#    integrated drift back in wearing the clothes of an independent fix.
#
# 3. Two sources of yaw, both dead-reckoned. Neither /odom_raw yaw nor IMU yaw is
#    world-referenced, so averaging them cannot bound drift -- it only averages two
#    drifting estimates while reporting the confidence of a redundant pair.
#
# 4. It fuses vy, which is identically zero on this chassis. A commanded strafe produces
#    exactly zero on every /odom_raw axis (measured), so vy is a constant, not a
#    measurement.
#
# WHAT THIS CONFIG DOES INSTEAD
# -----------------------------
# * /odom_raw contributes TWIST ONLY (vx, vyaw). It is a velocity sensor; let it be one.
# * /imu contributes YAW RATE ONLY. No absolute yaw, because there is none to have.
# * /odom_laser contributes POSE (x, y, yaw) -- the only world-referenced input available,
#   and the only one that can bound drift rather than accumulate it.
#
# STATUS: NOT VALIDATED ON HARDWARE. /odom_laser has been exercised on recorded bags and
# on the car elevated on its stand, never on a robot driving across a floor. Do not use
# this config for anything safety-bearing until it has been. See
# docs/sensor-fusion-research.md.

ekf_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 10.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true          # on, unlike the vendor: this config is on trial
        debug: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        # --- wheel encoders: VELOCITY ONLY -------------------------------------------
        # Order is [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw,
        #           ax, ay, az].
        # Pose entries are all false: fusing them alongside the twist below would be the
        # vendor's double-count. vy stays false because it is identically zero on a
        # differential chassis, not because it is unmeasured.
        odom0: /odom_raw
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  false, false,
                       false, false, true,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false
        odom0_twist_rejection_threshold: 1.542

        # --- lidar odometry: POSE, the only world-referenced input -------------------
        # The node publishes pose with a covariance derived from the scan geometry and
        # withholds the message entirely when the geometry is degenerate, so a missing
        # measurement here means "the room could not tell", not "no motion".
        odom1: /odom_laser
        odom1_config: [true,  true,  false,
                       false, false, true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_nodelay: false
        odom1_differential: false
        odom1_relative: false
        odom1_pose_rejection_threshold: 5.0

        # --- IMU: YAW RATE ONLY ------------------------------------------------------
        # No absolute yaw: there is no magnetometer, so the driver's yaw is the gyro
        # integrated, and fusing it would be feeding this filter its own drift back.
        imu0: /imu/data
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: false
        imu0_queue_size: 10
        imu0_twist_rejection_threshold: 1.542
        imu0_remove_gravitational_acceleration: true

        use_control: false
